name: bike_renting_app
version: 1.0.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-bike_renting_app: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.bike_renting_app # adjust accordingly to your app name

apps:
